<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPUBLIC RT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .main-page {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .main-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .logo {
      position: absolute;
      top: 7%;
      left: 50%;
      width: clamp(75px, 8vw, 115px);
      height: auto;

      opacity: 0;
      transform: translateX(-50%) scale(.7);

      animation: logoIn .9s ease forwards;
      animation-delay: .5s;

      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 65%;
      left: 50%;
      width: 100%;

      transform: translate(-50%, -40%) scale(.95);

      text-align: center;
      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(30px, 5.5vw, 72px);
      font-weight: 800;
      letter-spacing: clamp(3px, .8vw, 9px);

      opacity: 0;

      animation: titleIn .9s ease forwards;
      animation-delay: 1.5s;

      pointer-events: none;
    }

    .continue {
      position: absolute;
      left: 50%;
      bottom: 7%;

      transform: translateX(-50%) translateY(15px);

      border: 0;
      background: transparent;

      color: #fff;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(14px, 1.5vw, 19px);
      font-weight: 700;
      letter-spacing: clamp(2px, .35vw, 5px);

      cursor: pointer;

      opacity: 0;

      animation: continueIn .9s ease forwards;
      animation-delay: 2s;
    }

    .arrow {
      display: inline-block;
      margin-left: 8px;
      transition: transform .3s ease;
    }

    .continue:hover .arrow {
      transform: translateX(8px);
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: translateX(-50%) scale(.7);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }

    @keyframes titleIn {
      from {
        opacity: 0;
        transform: translate(-50%, -40%) scale(.95);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes continueIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    @media (max-width: 600px) {
      .logo {
        top: 7%;
        width: 82px;
      }

      .title {
        top: 65%;
        font-size: 29px;
        letter-spacing: 4px;
      }

      .continue {
        bottom: 6.5%;
        font-size: 14px;
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>

  <main class="main-page">

    <img
      src="main.png"
      class="main-bg"
      alt="REPUBLIC RT"
    >

    <img
      src="logo.png"
      class="logo"
      alt="Logo"
    >

    <h1 class="title">
      REPUBLIC RT
    </h1>

    <button class="continue" type="button">
      CONTINUE <span class="arrow">→</span>
    </button>

  </main>

</body>
  </html>
